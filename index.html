<!doctype html>
<html lang="vi">
  <head>
    <script>
      // Gracefully prevent benign Vite WebSocket / AbortError / Firestore transient offline reconnection from surfacing unhandled rejections in AI Studio
      if (typeof window !== 'undefined') {
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          var msg = (r && (r.message || (typeof r === 'string' ? r : ''))) || '';
          var code = (r && r.code) || '';
          if (
            msg.includes('WebSocket') ||
            msg.includes('websocket') ||
            (r && r.name === 'AbortError') ||
            msg.includes('user aborted') ||
            msg.includes('The play() request was interrupted') ||
            code === 'unavailable' ||
            msg.includes('Could not reach Cloud Firestore backend')
          ) {
            e.preventDefault();
          }
        });
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Minnese</title>
    <meta name="description" content="Full-stack Chinese learning platform with Gemini AI RAG tutor, SM-2 Spaced Repetition flashcards, HSK dictionary, stroke guides, interactive quizzes, Workbook Studio OCR & AI exam remixer, and admin dashboard." />

    <meta property="og:description" content="Full-stack Chinese learning platform with Gemini AI RAG tutor, SM-2 Spaced Repetition flashcards, HSK dictionary, stroke guides, interactive quizzes, Workbook Studio OCR & AI exam remixer, and admin dashboard." />

  </head>
