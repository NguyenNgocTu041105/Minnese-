<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>{{ title }} - QBank Admin</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #1e293b; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); max-width: 480px; text-align: center; }
        h1 { color: #dc2626; font-size: 1.5rem; margin-bottom: 1rem; }
        p { color: #64748b; line-height: 1.5; margin-bottom: 1.5rem; }
        a { display: inline-block; background: #2563eb; color: white; padding: 0.5rem 1rem; text-decoration: none; border-radius: 6px; font-weight: 500; }
        a:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Lỗi {{ code }}: {{ title }}</h1>
        <p>{{ message }}</p>
        <a href="/">Về Trang chủ QBank</a>
    </div>
</body>
</html>
